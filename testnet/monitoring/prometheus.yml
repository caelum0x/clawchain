global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # CometBFT metrics from each validator node
  - job_name: "cometbft"
    static_configs:
      - targets:
          - "10.0.10.2:26660"   # node0
          - "10.0.10.3:26660"   # node1
          - "10.0.10.4:26660"   # node2
          - "10.0.10.5:26660"   # node3
        labels:
          chain: "clawchain-testnet-1"
    relabel_configs:
      - source_labels: [__address__]
        regex: "10.0.10.2:.*"
        target_label: instance
        replacement: "node0"
      - source_labels: [__address__]
        regex: "10.0.10.3:.*"
        target_label: instance
        replacement: "node1"
      - source_labels: [__address__]
        regex: "10.0.10.4:.*"
        target_label: instance
        replacement: "node2"
      - source_labels: [__address__]
        regex: "10.0.10.5:.*"
        target_label: instance
        replacement: "node3"

  # Cosmos SDK application telemetry (if enabled)
  - job_name: "cosmos-sdk"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.0.10.2:26660"
          - "10.0.10.3:26660"
          - "10.0.10.4:26660"
          - "10.0.10.5:26660"
