name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Run integration tests
        run: go test -tags=integration -race -timeout 20m ./x/...

      - name: Run oracle integration tests
        run: go test -tags=integration -race -v -timeout 5m ./x/oracle/...

      - name: Run governance integration tests
        run: go test -tags=integration -race -v -timeout 5m ./x/governance/...

      - name: Run E2E tests (Phase C)
        run: go test -tags=e2e -race -timeout 30m ./tests/e2e/...

      - name: Coverage report
        run: |
          go test -tags=integration -coverprofile=coverage.out -timeout 20m ./x/...
          go tool cover -func=coverage.out | grep "total:"
