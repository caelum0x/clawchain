name: PRD Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prd-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run fast PRD verification
        run: |
          make prd-verify
