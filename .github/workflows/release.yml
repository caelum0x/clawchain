# ClawChain Release Workflow
#
# Triggers:
# a) Push a tag with "v" prefix (e.g., v1.0.0-alpha) — creates a prerelease with binaries
# b) Push to main — updates the "latest" prerelease with bleeding-edge binaries
#
# Artifacts:
# - clawchaind + clawproof binaries (linux/amd64, darwin/amd64, darwin/arm64)
# - Go backend service binaries
# - SHA256SUMS.txt for all artifacts

on: push

permissions:
  contents: write

jobs:
  chain-release:
    name: Build Chain Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Variables
        id: vars
        uses: ignite/cli/actions/release/vars@main

      - name: Issue Release Assets
        uses: ignite/cli/actions/cli@main
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          args: chain build --release --release.prefix ${{ steps.vars.outputs.tarball_prefix }} -t linux:amd64 -t darwin:amd64 -t darwin:arm64 -y
        env:
          DO_NOT_TRACK: 1
          GOFLAGS: "-buildvcs=false"

      - name: Build additional Go services
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Compile service binaries
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        run: |
          mkdir -p release/services
          for svc in claw-faucet claw-eventsd claw-notifyd claw-inference-sidecar claw-gpu-provider claw-txhistoryd clawproof; do
            echo "Building $svc..."
            go build -o release/services/$svc ./cmd/$svc
          done

      - name: Generate SHA-256 checksums
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        run: |
          cd release
          sha256sum * services/* 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Generate release notes
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        run: |
          cat > release/RELEASE_NOTES.md << 'NOTES'
          ## ClawChain Release

          ### Binaries
          - `clawchaind` — Chain node binary (CometBFT + Cosmos SDK + CosmWasm)
          - `clawproof` — ZK proof generator (Groth16/BN254)

          ### Backend Services
          - `claw-faucet` — Token faucet service
          - `claw-eventsd` — WebSocket event proxy
          - `claw-notifyd` — Notification service
          - `claw-inference-sidecar` — AI model inference proxy
          - `claw-gpu-provider` — GPU compute provider daemon
          - `claw-txhistoryd` — Transaction history indexer

          ### Verify checksums
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          NOTES

      - name: Delete the "latest" Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        if: ${{ steps.vars.outputs.is_release_type_latest == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: |
            release/*
            release/services/*
          body_path: release/RELEASE_NOTES.md
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
