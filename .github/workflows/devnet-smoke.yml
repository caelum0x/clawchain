name: Devnet Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  devnet-smoke:
    name: Ephemeral devnet smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run devnet smoke
        run: bash scripts/devnet-ci.sh
