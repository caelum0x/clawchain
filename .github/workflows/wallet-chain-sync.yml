name: wallet-chain-sync

on:
  pull_request:
    paths:
      - "keplr-wallet/apps/extension/src/config.ts"
      - "claw-wallet-mobile/sandbox/sandbox_react_native/constants/chain.ts"
      - "keplr-chain-registry/cosmos/clawchain.json"
      - "keplr-chain-registry/cosmos/clawchain-testnet.json"
      - "scripts/verify-wallet-chain-sync.mjs"
      - "Makefile"
  push:
    branches: ["main", "master"]
    paths:
      - "keplr-wallet/apps/extension/src/config.ts"
      - "claw-wallet-mobile/sandbox/sandbox_react_native/constants/chain.ts"
      - "keplr-chain-registry/cosmos/clawchain.json"
      - "keplr-chain-registry/cosmos/clawchain-testnet.json"
      - "scripts/verify-wallet-chain-sync.mjs"
      - "Makefile"

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify wallet chain sync
        run: make wallet-chain-sync-check
