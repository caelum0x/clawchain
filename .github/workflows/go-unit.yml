name: Unit tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        go-version: ["1.24"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Run tests with race detector
        run: go test -race -timeout 20m ./...
      - name: Run oracle module tests
        run: go test -race -v -timeout 5m ./x/oracle/...
      - name: Run governance module tests
        run: go test -race -v -timeout 5m ./x/governance/...
      - name: Run vet
        run: go vet ./...
