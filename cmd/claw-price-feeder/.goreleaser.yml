---
project_name: claw-price-feeder

env:
  - CGO_ENABLED=1

before:
  hooks:
    - go mod download

builds:
  - main: ./
    id: "claw-price-feeder"
    binary: claw-price-feeder
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -tags=badgerdb ledger netgo
      - -trimpath
    ldflags:
      - -s -w
      - -X main.commit={{.Commit}}
      - -X main.date={{ .CommitDate }} 
      - -X clawchain/cmd/claw-price-feeder/cmd.Version={{ .Version }}
      - -X clawchain/cmd/claw-price-feeder/cmd.Commit={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: bins
    format: binary
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

  - id: tarball
    format: tar.gz
    name_template: "{{ .Binary }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md

release:
  github:
    owner: clawchain
    name: claw-price-feeder

snapshot:
  name_template: SNAPSHOT-{{ .Commit }}

checksum:
  name_template: SHA256SUMS-v{{.Version}}.txt
  algorithm: sha256

changelog:
  skip: false
