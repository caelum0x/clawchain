apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-eventsd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-eventsd
    app.kubernetes.io/component: events
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-eventsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-eventsd
        app.kubernetes.io/component: events
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eventsd
          image: clawchain/eventsd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8891
          env:
            - name: CHAIN_RPC
              value: "http://clawchain-node.clawchain.svc:26657"
            - name: CHAIN_WS
              value: "ws://clawchain-node.clawchain.svc:26657/websocket"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8891
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8891
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-eventsd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-eventsd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8891
  selector:
    app.kubernetes.io/name: clawchain-eventsd
