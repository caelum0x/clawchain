apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-docs
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-docs
    app.kubernetes.io/component: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-docs
        app.kubernetes.io/component: docs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: clawchain/docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-docs
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-docs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8091
  selector:
    app.kubernetes.io/name: clawchain-docs
