apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-landing
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-landing
    app.kubernetes.io/component: landing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-landing
        app.kubernetes.io/component: landing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing
          image: clawchain/landing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-landing
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-landing
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8090
  selector:
    app.kubernetes.io/name: clawchain-landing
