apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-notifyd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-notifyd
    app.kubernetes.io/component: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-notifyd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-notifyd
        app.kubernetes.io/component: notifications
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifyd
          image: clawchain/notifyd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8892
          env:
            - name: CHAIN_REST
              value: "http://clawchain-node.clawchain.svc:1317"
            - name: CHAIN_RPC
              value: "http://clawchain-node.clawchain.svc:26657"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8892
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8892
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-notifyd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-notifyd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8892
  selector:
    app.kubernetes.io/name: clawchain-notifyd
