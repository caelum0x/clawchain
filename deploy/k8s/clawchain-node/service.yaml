apiVersion: v1
kind: Service
metadata:
  name: clawchain-node
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-node
    app.kubernetes.io/component: validator
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: 26657
      targetPort: 26657
      protocol: TCP
    - name: rest
      port: 1317
      targetPort: 1317
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: p2p
      port: 26656
      targetPort: 26656
      protocol: TCP
    - name: prometheus
      port: 26660
      targetPort: 26660
      protocol: TCP
  selector:
    app.kubernetes.io/name: clawchain-node
---
# Headless service for StatefulSet DNS-based peer discovery.
apiVersion: v1
kind: Service
metadata:
  name: clawchain-node-headless
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-node
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
  selector:
    app.kubernetes.io/name: clawchain-node
