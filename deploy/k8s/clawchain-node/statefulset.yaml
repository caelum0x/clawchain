apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clawchain-node
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-node
    app.kubernetes.io/component: validator
spec:
  serviceName: clawchain-node-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-node
        app.kubernetes.io/component: validator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
    spec:
      serviceAccountName: clawchain-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clawchaind
          image: clawchain/clawchaind:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/entrypoint.sh"]
          env:
            - name: CHAIN_ID
              value: "clawchain-1"
            - name: MONIKER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CHAIN_HOME
              value: "/data/.clawchain"
            - name: PERSISTENT_PEERS
              value: ""
          ports:
            - name: rpc
              containerPort: 26657
            - name: rest
              containerPort: 1317
            - name: grpc
              containerPort: 9090
            - name: p2p
              containerPort: 26656
            - name: prometheus
              containerPort: 26660
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: genesis
              mountPath: /config/genesis.json
              subPath: genesis.json
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 26657
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 26657
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: clawchain-node-config
            defaultMode: 0755
        - name: secrets
          secret:
            secretName: clawchain-node-keys
            defaultMode: 0400
            optional: true
        - name: genesis
          configMap:
            name: clawchain-genesis
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: clawchain-node
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
