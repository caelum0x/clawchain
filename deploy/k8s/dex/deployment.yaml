apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-dex
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-dex
    app.kubernetes.io/component: dex
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-dex
        app.kubernetes.io/component: dex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: clawchain/dex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_CHAIN_ID
              value: "clawchain-1"
            - name: NEXT_PUBLIC_LCD
              value: "http://clawchain-node.clawchain.svc:1317"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-dex
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-dex
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: clawchain-dex
