apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-web
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-web
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-web
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: clawchain-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: clawchain/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_CLAWCHAIN_CHAIN_ID
              value: "clawchain-1"
            - name: VITE_CLAWCHAIN_REST_URL
              value: "https://api.clawchain.io"
            - name: VITE_CLAWCHAIN_RPC_URL
              value: "https://rpc.clawchain.io"
            - name: VITE_CLAWCHAIN_FAUCET_URL
              value: "https://faucet.clawchain.io"
            - name: VITE_CLAWCHAIN_WALLET_URL
              value: "https://wallet.clawchain.io"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-web
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: clawchain-web
