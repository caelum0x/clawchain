# ClawChain RBAC — least-privilege ServiceAccounts for all workloads
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawchain-node
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-node
    app.kubernetes.io/component: validator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawchain-web
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-web
    app.kubernetes.io/component: dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claw-gpu-provider
  namespace: clawchain
  labels:
    app.kubernetes.io/name: claw-gpu-provider
    app.kubernetes.io/component: gpu-provider
---
# ClawChain node needs to read its own configmaps and secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawchain-node
  namespace: clawchain
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["clawchain-node-config", "clawchain-genesis"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["clawchain-node-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clawchain-node
  namespace: clawchain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clawchain-node
subjects:
  - kind: ServiceAccount
    name: clawchain-node
    namespace: clawchain
---
# GPU provider needs to read its config and secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claw-gpu-provider
  namespace: clawchain
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-provider-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gpu-provider-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claw-gpu-provider
  namespace: clawchain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claw-gpu-provider
subjects:
  - kind: ServiceAccount
    name: claw-gpu-provider
    namespace: clawchain
---
# Web dashboard: no special permissions (read-only frontend)
# ServiceAccount exists for pod identity only — no Role needed
