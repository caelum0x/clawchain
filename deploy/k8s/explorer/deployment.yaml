apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-explorer
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-explorer
    app.kubernetes.io/component: explorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-explorer
        app.kubernetes.io/component: explorer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: explorer
          image: clawchain/explorer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VITE_CHAIN_API
              value: "http://clawchain-node.clawchain.svc:1317"
            - name: VITE_CHAIN_RPC
              value: "http://clawchain-node.clawchain.svc:26657"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-explorer
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-explorer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: clawchain-explorer
