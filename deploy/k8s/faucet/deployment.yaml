apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawchain-faucet
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-faucet
    app.kubernetes.io/component: faucet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clawchain-faucet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawchain-faucet
        app.kubernetes.io/component: faucet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: faucet
          image: clawchain/faucet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: CHAIN_REST
              value: "http://clawchain-node.clawchain.svc:1317"
            - name: CHAIN_RPC
              value: "http://clawchain-node.clawchain.svc:26657"
            - name: CHAIN_ID
              value: "clawchain-1"
            - name: FAUCET_MNEMONIC
              valueFrom:
                secretKeyRef:
                  name: faucet-secrets
                  key: mnemonic
            - name: FAUCET_AMOUNT
              value: "10000000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawchain-faucet
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawchain-faucet
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8888
  selector:
    app.kubernetes.io/name: clawchain-faucet
---
# Create secrets manually:
# kubectl create secret generic faucet-secrets \
#   --namespace clawchain \
#   --from-literal=mnemonic="your faucet mnemonic here"
