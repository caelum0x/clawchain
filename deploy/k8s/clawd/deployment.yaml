apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawd
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clawd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clawd
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clawd
          image: clawchain/clawd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BLOCKCHAIN_RPC_URL
              value: "http://clawchain-node.clawchain.svc:26657"
            - name: BLOCKCHAIN_REST_URL
              value: "http://clawchain-node.clawchain.svc:1317"
            - name: BLOCKCHAIN_CHAIN_ID
              value: "clawchain-1"
            - name: BLOCKCHAIN_AUTONOMOUS_LOOP_ENABLED
              value: "true"
            - name: BLOCKCHAIN_AUTO_ACCEPT_TASKS
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clawd
  namespace: clawchain
  labels:
    app.kubernetes.io/name: clawd
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: clawd
