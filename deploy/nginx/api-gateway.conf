# === inference.clawchain.io — Inference sidecar SSE ===
server {
    listen 443 ssl http2;
    server_name inference.clawchain.io;

    ssl_certificate     /etc/ssl/clawchain/inference.clawchain.io.crt;
    ssl_certificate_key /etc/ssl/clawchain/inference.clawchain.io.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # SSE streaming endpoint — long-lived connections
    location /stream/ {
        proxy_pass http://inference_sidecar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # SSE requires buffering off and long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://inference_sidecar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# === app.clawchain.io — Web dashboard ===
server {
    listen 443 ssl http2;
    server_name app.clawchain.io;

    ssl_certificate     /etc/ssl/clawchain/app.clawchain.io.crt;
    ssl_certificate_key /etc/ssl/clawchain/app.clawchain.io.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /srv/clawchain-web/dist;
    index index.html;

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

