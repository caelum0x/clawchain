# === HTTP → HTTPS redirect ===
server {
    listen 80;
    server_name api.clawchain.io rpc.clawchain.io grpc.clawchain.io
                faucet.clawchain.io inference.clawchain.io app.clawchain.io
                explorer.clawchain.io dex.clawchain.io events.clawchain.io
                notify.clawchain.io docs.clawchain.io clawchain.io www.clawchain.io;
    return 301 https://$host$request_uri;
}
