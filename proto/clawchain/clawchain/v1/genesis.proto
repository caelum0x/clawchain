syntax = "proto3";
package clawchain.clawchain.v1;

import "amino/amino.proto";
import "clawchain/clawchain/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "clawchain/x/clawchain/types";

// GenesisState defines the clawchain module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
