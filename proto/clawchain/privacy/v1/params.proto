syntax = "proto3";
package clawchain.privacy.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "clawchain/x/privacy/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "clawchain/x/privacy/Params";
  option (gogoproto.equal) = true;

  // max_privacy_tx_per_block is the maximum number of privacy transactions
  // (shield, unshield, private_transfer) allowed per block. 0 means unlimited.
  uint64 max_privacy_tx_per_block = 1;
}
