syntax = "proto3";

package clawchain.privacy.v1;

import "amino/amino.proto";
import "clawchain/privacy/v1/params.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "clawchain/x/privacy/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/params";
  }

  // MerkleRoot Queries a list of MerkleRoot items.
  rpc MerkleRoot(QueryMerkleRootRequest) returns (QueryMerkleRootResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/merkle_root";
  }

  // NullifierExists Queries a list of NullifierExists items.
  rpc NullifierExists(QueryNullifierExistsRequest) returns (QueryNullifierExistsResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/nullifier_exists/{nullifier}";
  }

  // RootHistory queries an ordered range of historical Merkle roots.
  rpc RootHistory(QueryRootHistoryRequest) returns (QueryRootHistoryResponse) {
    option (google.api.http) = {
      get: "/clawchain/privacy/v1/root_history/{offset}/{limit}"
      additional_bindings {
        get: "/clawchain/privacy/v1/root_history"
      }
    };
  }

  // ViewKey queries an encrypted note by commitment.
  rpc ViewKey(QueryViewKeyRequest) returns (QueryViewKeyResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/view_key/{commitment_hex}";
  }

  // VerifyAmountProof verifies an amount disclosure proof for a commitment.
  rpc VerifyAmountProof(QueryVerifyAmountProofRequest) returns (QueryVerifyAmountProofResponse) {
    option (google.api.http).post = "/clawchain/privacy/v1/verify_amount_proof";
    option (google.api.http).body = "*";
  }

  // MerkleProof queries a Merkle proof for a commitment.
  rpc MerkleProof(QueryMerkleProofRequest) returns (QueryMerkleProofResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/merkle_proof/{commitment_hex}";
  }

  // CommitmentIndex queries a commitment leaf index.
  rpc CommitmentIndex(QueryCommitmentIndexRequest) returns (QueryCommitmentIndexResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/commitment_index/{commitment_hex}";
  }

  // TreeStats queries Merkle tree statistics.
  rpc TreeStats(QueryTreeStatsRequest) returns (QueryTreeStatsResponse) {
    option (google.api.http).get = "/clawchain/privacy/v1/tree_stats";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryMerkleRootRequest defines the QueryMerkleRootRequest message.
message QueryMerkleRootRequest {}

// QueryMerkleRootResponse defines the QueryMerkleRootResponse message.
message QueryMerkleRootResponse {
  string root = 1;
}

// QueryNullifierExistsRequest defines the QueryNullifierExistsRequest message.
message QueryNullifierExistsRequest {
  string nullifier = 1;
}

// QueryNullifierExistsResponse defines the QueryNullifierExistsResponse message.
message QueryNullifierExistsResponse {
  bool exists = 1;
}

message QueryRootHistoryRequest {
  uint64 offset = 1;
  uint64 limit = 2;
}

message QueryRootHistoryResponse {
  repeated string roots = 1;
  uint64 next_offset = 2;
  uint64 total = 3;
}

message QueryViewKeyRequest {
  string commitment_hex = 1;
}

message QueryViewKeyResponse {
  string encrypted_note = 1;
  bool found = 2;
}

message QueryVerifyAmountProofRequest {
  string commitment_hex = 1;
  uint64 amount = 2;
  bytes proof = 3;
}

message QueryVerifyAmountProofResponse {
  bool valid = 1;
}

message QueryMerkleProofRequest {
  string commitment_hex = 1;
}

message QueryMerkleProofResponse {
  uint64 leaf_index = 1;
  repeated string path = 2;
  repeated uint64 indices = 3;
  string root = 4;
  bool found = 5;
}

message QueryCommitmentIndexRequest {
  string commitment_hex = 1;
}

message QueryCommitmentIndexResponse {
  uint64 leaf_index = 1;
  bool found = 2;
}

message QueryTreeStatsRequest {}

message QueryTreeStatsResponse {
  uint64 leaf_count = 1;
  string current_root = 2;
  uint32 tree_depth = 3;
}
