syntax = "proto3";
package clawchain.messaging.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "clawchain/x/messaging/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "clawchain/x/messaging/Params";
  option (gogoproto.equal) = true;

  // max_message_size is the maximum ciphertext size in bytes (default: 4096).
  uint64 max_message_size = 1;

  // message_ttl_blocks is the number of blocks after which messages expire and
  // are pruned in EndBlock (default: 100800 ≈ 7 days at 6s blocks). 0 = no expiry.
  uint64 message_ttl_blocks = 2;
}
