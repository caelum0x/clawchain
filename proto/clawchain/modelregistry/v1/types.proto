syntax = "proto3";
package clawchain.modelregistry.v1;

import "cosmos_proto/cosmos.proto";

option go_package = "clawchain/x/modelregistry/types";

// ModelRecord represents a registered AI model.
message ModelRecord {
  uint64 id = 1;
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  string description = 4;
  string framework = 5;
  string architecture = 6;
  string parameter_count = 7;
  string license = 8;
  repeated string tags = 9;
  string storage_type = 10;
  string storage_uri = 11;
  string checksum_sha256 = 12;
  uint64 size_bytes = 13;
  string access_type = 14;
  string price_per_query_uclaw = 15;
  string price_one_time_uclaw = 16;
  bool active = 17;
  uint64 current_version = 18;
  uint64 total_downloads = 19;
  string total_revenue = 20;
  uint32 rating = 21;
  uint32 rating_count = 22;
  int64 created_at = 23;
  int64 updated_at = 24;
  string price_subscription_uclaw = 25;
  uint64 subscription_period_blocks = 26;
}

// ModelVersion represents a version of a registered model.
message ModelVersion {
  uint64 id = 1;
  uint64 model_id = 2;
  uint64 version = 3;
  string storage_uri = 4;
  string checksum_sha256 = 5;
  uint64 size_bytes = 6;
  string changelog = 7;
  int64 created_at = 8;
}

// InferenceJob represents an inference job request.
message InferenceJob {
  uint64 job_id = 1;
  uint64 model_id = 2;
  uint64 model_version = 3;
  string requester = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string provider = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string input = 6;
  string output = 7;
  string status = 8;
  uint64 max_tokens = 9;
  string temperature = 10;
  string payment = 11;
  uint64 gas_used = 12;
  int64 created_at = 13;
  int64 started_at = 14;
  int64 completed_at = 15;
  int64 timeout_block = 16;
  string error_msg = 17;
  // P4 usage attestation (set by MsgSubmitUsageAttestation on a completed job).
  string attestation_hash = 18;
  uint64 attested_output_tokens = 19;
  int64 attested_at = 20;
  // P4 dispute (set by MsgDisputeInferenceJob by the original requester).
  bool disputed = 21;
  string dispute_reason = 22;
  int64 disputed_at = 23;
}

// InferenceProvider represents a registered inference provider.
message InferenceProvider {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated uint64 model_ids = 2;
  uint64 max_concurrent = 3;
  uint64 active_jobs = 4;
  uint64 total_jobs = 5;
  string total_earnings = 6;
  uint64 avg_latency_ms = 7;
  string endpoint = 8;
  bool is_online = 9;
  int64 last_heartbeat = 10;
}

// InferencePricing represents pricing for a model's inference.
message InferencePricing {
  uint64 model_id = 1;
  string price_per_token = 2;
  string price_per_query = 3;
  string min_payment = 4;
  uint64 max_tokens = 5;
}
