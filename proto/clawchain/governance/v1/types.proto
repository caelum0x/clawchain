syntax = "proto3";
package clawchain.governance.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "clawchain/x/governance/types";

// Proposal represents a governance proposal.
message Proposal {
  uint64 proposal_id = 1;
  string title = 2;
  string description = 3;
  string module = 4;
  string param_key = 5;
  string proposed_value = 6;
  string proposer = 7 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string deposit = 8;
  string status = 9;
  int64 voting_end_block = 10;
  string yes_votes = 11 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string no_votes = 12 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string abstain_votes = 13 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  int64 created_at = 14;
  string veto_votes = 15 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  int64 execution_height = 16;
  string execution_error = 17;
}

// Vote represents a governance vote.
message Vote {
  uint64 proposal_id = 1;
  string voter = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string option = 3;
  string weight = 4 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
}
