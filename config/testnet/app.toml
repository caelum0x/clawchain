# ClawChain Testnet - Application Configuration
#
# This file configures the Cosmos SDK application layer for a testnet node.
# Copy this file to ~/.clawchain/config/app.toml and adjust as needed.

###############################################################################
###                        Base Configuration                               ###
###############################################################################

# The minimum gas prices a validator is willing to accept for processing a
# transaction. A transaction's fees must meet the minimum of any denomination
# specified in this config (e.g. 0.001uclaw).
# Testnet uses a low minimum to allow experimentation.
minimum-gas-prices = "0.001uclaw"

# The amount of history versions to keep when pruning application state.
# "default" keeps recent state for query access while discarding old versions.
# Options: "default", "nothing" (keep all), "everything" (prune all), "custom"
pruning = "default"

# These are applied if pruning strategy is custom.
# pruning-keep-recent = "0"
# pruning-interval = "0"

# HaltHeight contains a non-zero block height at which a node will gracefully
# halt and shutdown that can be used to assist upgrades and testing.
halt-height = 0

# HaltTime contains a non-zero minimum block time (in Unix seconds) at which
# a node will gracefully halt and shutdown.
halt-time = 0

# MinRetainBlocks defines the minimum block height offset from the current
# block being committed, such that all blocks past this offset are pruned
# from CometBFT. A value of 0 indicates all blocks are kept.
min-retain-blocks = 0

# Inter-block cache size. Setting this to 0 disables the cache.
inter-block-cache = true

# IndexEvents defines the set of events in the form {eventType}.{attributeKey},
# which informs CometBFT what to index. If empty, all events will be indexed.
# Example: ["message.sender", "message.recipient"]
index-events = []

# IavlCacheSize set the size of the iavl tree cache (in number of nodes).
iavl-cache-size = 781250

# IAVLDisableFastNode enables or disables the fast node feature of IAVL.
iavl-disable-fastnode = false

# AppDBBackend defines the database backend type to use for application and
# snapshots DBs. Options: "goleveldb", "pebbledb"
# app-db-backend = ""

###############################################################################
###                         Telemetry Configuration                         ###
###############################################################################

[telemetry]

# Prefixed with keys to separate services.
service-name = ""

# Enabled enables the application telemetry functionality. When enabled,
# an in-memory sink is also enabled by default. Operators may also enable
# other sinks such as Prometheus.
enabled = true

# Enable prefixing gauge values with hostname.
enable-hostname = false

# Enable adding hostname to labels.
enable-hostname-label = false

# Enable adding service to labels.
enable-service-label = false

# PrometheusRetentionTime defines the retention duration (in seconds) for
# Prometheus metrics. A value of 0 means metrics are deleted immediately
# after being scraped. A positive value means metrics are kept in memory
# for the specified duration before being deleted.
prometheus-retention-time = 60

# GlobalLabels defines a global set of name/value label tuples applied to all
# metrics emitted using the wrapper functions defined in telemetry package.
# Example: [["chain_id", "clawchain-testnet-1"]]
global-labels = [["chain_id", "clawchain-testnet-1"]]

###############################################################################
###                           API Configuration                             ###
###############################################################################

[api]

# Enable defines if the API server should be enabled.
# The API server provides REST endpoints for querying chain state.
enable = true

# Swagger defines if swagger documentation should automatically be registered.
swagger = true

# Address defines the API server to listen on.
# Default: tcp://localhost:1317
address = "tcp://0.0.0.0:1317"

# MaxOpenConnections defines the number of maximum open connections.
max-open-connections = 1000

# RPCReadTimeout defines the CometBFT RPC read timeout (in seconds).
rpc-read-timeout = 10

# RPCWriteTimeout defines the CometBFT RPC write timeout (in seconds).
rpc-write-timeout = 0

# RPCMaxBodyBytes defines the CometBFT maximum request body (in bytes).
rpc-max-body-bytes = 1000000

# EnableUnsafeCORS defines if CORS should be enabled (unsafe - use it at your
# own risk). This is useful for local development and testing.
enabled-unsafe-cors = true

###############################################################################
###                         gRPC Configuration                              ###
###############################################################################

[grpc]

# Enable defines if the gRPC server should be enabled.
# gRPC is used for programmatic access and is required by many tools.
enable = true

# Address defines the gRPC server address to bind to.
address = "0.0.0.0:9090"

# MaxRecvMsgSize defines the max message size in bytes the server can receive.
# The default value is 10MB.
max-recv-msg-size = "10485760"

# MaxSendMsgSize defines the max message size in bytes the server can send.
# The default value is math.MaxInt32.
max-send-msg-size = "2147483647"

###############################################################################
###                        gRPC Web Configuration                           ###
###############################################################################

[grpc-web]

# GRPCWebEnable defines if the gRPC-web should be enabled.
# NOTE: gRPC must also be enabled.
enable = true

# Address defines the gRPC-web server address to bind to.
address = "0.0.0.0:9091"

# EnableUnsafeCORS defines if CORS should be enabled (unsafe - use it at your
# own risk). Useful for testnet and local development.
enable-unsafe-cors = true

###############################################################################
###                        State Sync Configuration                         ###
###############################################################################

[state-sync]

# State sync snapshots allow other nodes to rapidly catch up to the chain
# without replaying historical blocks. Adjust snapshot-interval to control
# how often snapshots are created.

# snapshot-interval specifies the block interval at which local state sync
# snapshots are taken (0 to disable).
snapshot-interval = 0

# snapshot-keep-recent specifies the number of recent snapshots to keep and
# serve (0 to keep all).
snapshot-keep-recent = 2

###############################################################################
###                        Mempool Configuration                            ###
###############################################################################

[mempool]

# max-txs specifies the maximum number of transactions in the mempool.
# A value of -1 means unlimited. 0 means the mempool is disabled.
max-txs = 5000
